<!DOCTYPE html>
<html lang="en">
<head>

<title>Premjeet ❤️ Manwi - Royal Wedding</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a0508;color:#f5e6c8;font-family:'Playfair Display',serif;overflow-x:hidden}
.great{font-family:'Great Vibes',cursive}
.cinzel{font-family:'Cinzel',serif}
.petals{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;overflow:hidden}
.petal{position:absolute;top:-10%;font-size:18px;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0deg) translateX(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg) translateX(100px);opacity:0.8}}
#envelopeScreen{position:fixed;inset:0;background:radial-gradient(ellipse at center,#4a1520 0%,#1a0508 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10000;transition:transform 1.2s cubic-bezier(.77,0,.175,1)}
#envelopeScreen.open{transform:translateY(-100%)}
.env{width:280px;height:180px;background:linear-gradient(145deg,#3d0f18,#2a0a10);border:2px solid #d4af37;position:relative;cursor:pointer;box-shadow:0 20px 60px rgba(0,0,0,0.8),0 0 30px rgba(212,175,55,0.2);animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.env:before{content:'';position:absolute;top:0;left:0;width:0;height:0;border-left:140px solid transparent;border-right:140px solid transparent;border-top:90px solid #d4af37;opacity:0.9}
.env:after{content:'💌';position:absolute;top:50%;left:50%;transform:translate(-50%,-30%);font-size:50px}
.seal{position:absolute;bottom:-25px;left:50%;transform:translateX(-50%);width:60px;height:60px;background:radial-gradient(#e8c766,#8a6d2b);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 15px rgba(0,0,0,0.5);border:2px solid #5a4a20}
.tap{margin-top:70px;color:#d4af37;letter-spacing:4px;font-size:0.8rem;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
.hero{min-height:100vh;padding:30px 15px;display:flex;flex-direction:column;align-items:center;background:radial-gradient(circle at center,#4a1520 0%,#1a0508 100%)}
.orn{width:200px;height:1px;background:linear-gradient(90deg,transparent,#d4af37,transparent);margin:12px 0}
.frame{width:92%;max-width:400px;border:1.5px solid #d4af37;padding:10px;background:rgba(40,10,15,0.95);box-shadow:0 0 40px rgba(212,175,55,0.25);position:relative;margin:20px 0}
.frame img{width:100%;border-radius:6px;display:block;border:1px solid #8a6d2b}
.caption{margin-top:12px;padding-top:10px;border-top:1px solid rgba(212,175,55,0.25)}
.badge{border:1px solid #d4af37;padding:12px 25px;margin:20px 0;letter-spacing:3px;font-size:0.75rem}
.countdown{display:flex;gap:12px;margin:20px 0}
.cd-box{background:rgba(212,175,55,0.08);border:1px solid rgba(212,175,55,0.3);padding:10px 14px;min-width:65px}
.cd-box b{font-size:1.6rem;display:block;color:#f9e29b}
.cd-box span{font-size:0.65rem;letter-spacing:2px;color:#d4af37}
.venue{margin-top:25px;line-height:1.8;font-size:0.95rem}
.venue b{color:#d4af37;letter-spacing:2px}
#musicBtn{position:fixed;bottom:20px;right:20px;width:50px;height:50px;border-radius:50%;background:radial-gradient(#e8c766,#8a6d2b);border:2px solid #d4af37;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:100;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
</style>
</head>
